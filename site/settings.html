<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — RunTracker</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<script src="sidebar.js"></script>
</head>
<body>

<div class="shell">
<aside class="sidebar">
  <div class="sidebar-head">
    <div class="brand-block">
      <span class="brand">RunTracker</span>
      <span class="brand-sub" data-role-label></span>
    </div>
    <button type="button" class="sidebar-toggle" aria-label="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M6 2.5v11"/><path d="M10.5 6.5 9 8l1.5 1.5"/></svg></button>
  </div>
  <div class="persona-tabs mode-switch" data-mode-switch role="group" aria-label="Runner mode" hidden>
    <button type="button" data-mode="Beginner" aria-pressed="false">Beginner</button>
    <button type="button" data-mode="Expert" aria-pressed="false">Expert</button>
  </div>
  <nav class="side-nav" aria-label="Site">
    <a href="index.html"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span class="nav-label">Dashboard</span></a>
    <a href="index.html#history" data-runner-only hidden><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg><span class="nav-label">Run history</span></a>
  </nav>
  <nav class="side-nav side-nav--bottom" aria-label="Account">
    <a href="settings.html" aria-current="page"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4"/></svg><span class="nav-label">Settings</span></a>
    <a href="index.html" data-logout><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 2.5h-3v11h3"/><path d="M10 5l3 3-3 3"/><path d="M13 8H6.5"/></svg><span class="nav-label">Log out</span></a>
  </nav>
</aside>

<div class="shell-main">

<main class="content-page">

  <h1>Settings</h1>

  <section>
    <h2>Profile</h2>
    <p>To be filled in.</p>
    <label class="field-label" for="settings-name">Display name</label>
    <input class="text-input" id="settings-name" type="text" placeholder="Your name">
  </section>

  <section>
    <h2>Preferences</h2>
    <p>To be filled in.</p>
    <div class="persona-tabs" role="group" aria-label="Default view">
      <button type="button" aria-pressed="true">Beginner</button>
      <button type="button" aria-pressed="false">Expert</button>
    </div>
  </section>

  <section>
    <h2>Privacy</h2>
    <p>To be filled in.</p>
    <button type="button" class="btn btn--primary">Save changes</button>
    <button type="button" class="btn btn--ghost">Reset</button>
  </section>

</main>


</div>
</div>

<nav class="corner-links" aria-label="Info">
  <a href="privacy.html">Privacy</a>
  <a href="technical.html">Technical</a>
</nav>
</body>
</html>
