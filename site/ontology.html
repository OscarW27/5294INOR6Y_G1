<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontology (Turtle)</title>
<link rel="alternate" type="text/turtle" href="ontology.ttl">
<style>
  :root { --bg:#fff; --fg:#1d2330; --muted:#5b6475; --card:#f6f7fa; --line:#d9dde6; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171f; --fg:#e6e9f0; --muted:#9aa3b5; --card:#1c212c; --line:#2d3442; --accent:#6aa6ff; } }
  body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
  header, main { max-width: 64rem; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 24px; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  p { color: var(--muted); margin: 4px 0 12px; }
  a { color: var(--accent); margin-right: 16px; }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow: auto; font: .85rem/1.5 ui-monospace, Consolas, monospace; white-space: pre; }
</style>
</head>
<body>
<header>
  <h1>Endomondo Running Telemetry Ontology</h1>
  <p>Turtle source of <span id="iri">this ontology</span>.</p>
  <a href="ontologyviewer/">Open the viewer</a><a href="ontology.ttl" download="ontology.ttl">Download .ttl</a>
</header>
<main><pre id="src">Loading…</pre></main>
<script>
document.getElementById("iri").textContent = location.origin + location.pathname.replace(/\/ontology(\.html)?$/, "") + "/ontology";
fetch("ontology.ttl").then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(t => { document.getElementById("src").textContent = t; })
  .catch(e => { document.getElementById("src").textContent = "Could not load ontology.ttl: " + e.message; });
</script>
</body>
</html>
