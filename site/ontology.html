<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontology</title>
<link rel="alternate" type="text/turtle" href="ontology.ttl">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  #rawview { height: 100vh; display: flex; flex-direction: column; }
  #rawbar { padding: 8px 16px; border-bottom: 1px solid var(--border-subtle); background: var(--surface-card); font-size: .9rem; display: flex; gap: 16px; flex-wrap: wrap; color: var(--text-secondary); }
  #raw { flex: 1; min-height: 0; margin: 0; padding: 12px 16px; font: .85rem/1.5 var(--font-mono, ui-monospace, Consolas, monospace); white-space: pre; overflow: auto; background: var(--surface-card); color: var(--text-primary); }

  #viewerview { height: 100vh; display: flex; flex-direction: column; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 14px; background: var(--surface-card); border-bottom: 1px solid var(--border-subtle); font-size: .88rem; color: var(--text-secondary); }
  #bar strong { font-size: .95rem; color: var(--text-primary); }
  #bar label { cursor: pointer; white-space: nowrap; }
  #bar select { font: inherit; padding: 2px 4px; background: var(--surface-card); color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); }
  #bar .sp { flex: 1; }
  #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--surface-page); }
  #stage svg { width: 100%; height: 100%; display: block; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-muted); padding: 16px; text-align: center; }
  .err { color: var(--red-700) !important; }
  .foot { font-size: .72rem; color: var(--text-muted); padding: 1px 8px; border-top: 1px solid var(--border-subtle); }
  .foot a { color: var(--text-muted); }
</style>
</head>
<body>

<div class="shell">

<div class="shell-main">

<div id="rawview">
  <div id="rawbar">
    <a class="back-link" href="technical.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>Back to Technical</a>
    <a href="?viewer">Open viewer (?viewer)</a>
    <a href="ontology.ttl" download="ontology.ttl">Download .ttl</a>
  </div>
  <pre id="raw">Loading…</pre>
  <div class="foot"><a href="?viewer">Viewer</a> · <a href="ontology.ttl">Ontology (.ttl)</a> · <a href="https://github.com/OscarW27/5294INOR6Y_G1">GitHub</a></div>
</div>

<div id="viewerview" hidden>
  <div id="bar">
    <a class="back-link" href="technical.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>Back to Technical</a>
    <strong id="title">Ontology</strong>
    <label>Layout
      <select id="o-dir"><option value="LR">Left → Right</option><option value="TB">Top → Bottom</option></select>
    </label>
    <label><input type="checkbox" id="o-types" checked> Hide types</label>
    <label><input type="checkbox" id="o-annot" checked> Hide annotations</label>
    <label><input type="checkbox" id="o-example"> Example data</label>
    <label><input type="checkbox" id="o-full"> Full IRIs</label>
    <span class="sp"></span>
    <span id="count"></span>
    <a href="ontology">Raw Turtle</a>
  </div>
  <div id="stage"><div id="msg">Loading ontology…</div></div>
  <div class="foot"><a href="ontology">Raw Turtle</a> · <a href="ontology.ttl">Ontology (.ttl)</a> · <a href="https://github.com/OscarW27/5294INOR6Y_G1">GitHub</a></div>
</div>

</div>
</div>

<script>
const VIEWER = new URLSearchParams(location.search).has("viewer");
const TTL_URL = "ontology.ttl";   // this page lives at /ontology, so this is /ontology.ttl
const $ = id => document.getElementById(id);

if (!VIEWER) {
  fetch(TTL_URL).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(t => { $("raw").textContent = t; })
    .catch(e => { $("raw").textContent = "Could not load " + TTL_URL + ": " + e.message; });
} else {
  $("rawview").hidden = true;
  $("viewerview").hidden = false;
  const loadScript = src => new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("failed to load " + src));
    document.head.append(s);
  });
  Promise.all([
    loadScript("https://cdn.jsdelivr.net/npm/n3@1.17.2/browser/n3.min.js"),
    loadScript("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.7.0/lib/viz-standalone.js"),
    loadScript("https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js")
  ]).then(startViewer).catch(e => { $("msg").className = "err"; $("msg").textContent = e.message; });
}

function startViewer() {
const RDF = "http://www.w3.org/1999/02/22-rdf-syntax-ns#";
const RDFS = "http://www.w3.org/2000/01/rdf-schema#";
const OWL = "http://www.w3.org/2002/07/owl#";
const DCT = "http://purl.org/dc/terms/";
const ANNOTATION_PREDICATES = new Set([RDFS + "label", RDFS + "comment", RDFS + "seeAlso", DCT + "title", DCT + "description", OWL + "versionInfo"]);
const EXAMPLE_RE = /_\d+/;   // :Athlete_104, :Workout_58291, :Point_58291_0 ...

let model = null, viz = null, pz = null, seq = 0;

// N3's callback API is asynchronous: once per quad, then (null, null, prefixes) at the end.
function parse(text) {
  return new Promise((resolve, reject) => {
    const quads = [];
    new N3.Parser().parse(text, (err, q, pfx) => {
      if (err) return reject(err);
      if (q) quads.push(q); else resolve({ quads, prefixes: pfx || {} });
    });
  });
}

function short(iri, full) {
  if (full) return iri;
  const { ns, prefixes } = model;
  if (ns && iri.startsWith(ns)) return ":" + iri.slice(ns.length);
  for (const [p, base] of Object.entries(prefixes)) if (p && iri.startsWith(base)) return p + ":" + iri.slice(base.length);
  return iri;
}

const esc = s => s.replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n");
function wrap(s, n) {   // break long text into lines for readable node boxes
  const out = []; let line = "";
  for (const w of s.split(/\s+/)) {
    if ((line + " " + w).trim().length > n && line) { out.push(line); line = w; } else line = (line + " " + w).trim();
  }
  if (line) out.push(line);
  return out.join("\n");
}

function colors() {
  // Light-only brand palette, mirrored from css/tokens.css (Graphviz needs concrete colors).
  return { fg: "#1a1f36", line: "#c1c9d2", lit: "#0f5132", blank: "#8a5a00" };
}

// Pure: turns the parsed quads into Graphviz DOT for the chosen options. Returns { dot, triples }.
function buildDot(opts) {
  const c = colors();
  const ids = new Map(), lines = [];
  let n = 0, triples = 0;
  const nodeLine = (id, label, color, fontcolor) =>
    `  ${id} [label="${esc(label)}", color="${color}", fontcolor="${fontcolor}"];`;
  const resource = (term) => {
    const key = term.termType + term.value;
    if (ids.has(key)) return ids.get(key);
    const id = "n" + (n++);
    ids.set(key, id);
    if (term.termType === "BlankNode") lines.push(nodeLine(id, "_:" + term.value, c.blank, c.fg));
    else lines.push(nodeLine(id, wrap(short(term.value, opts.full), opts.full ? 60 : 40), c.line, c.fg));
    return id;
  };
  const literal = (term) => {      // one node per literal occurrence, never shared
    const id = "n" + (n++);
    lines.push(nodeLine(id, wrap(term.value, 44), c.lit, c.lit));
    return id;
  };
  for (const q of model.quads) {
    const p = q.predicate.value;
    if (opts.hideTypes && p === RDF + "type") continue;
    if (opts.hideAnnotations && ANNOTATION_PREDICATES.has(p)) continue;
    if (!opts.example && [q.subject, q.object].some(t => t.termType === "NamedNode" && EXAMPLE_RE.test(t.value.slice(model.ns.length)) && t.value.startsWith(model.ns))) continue;
    const s = resource(q.subject);
    const o = q.object.termType === "Literal" ? literal(q.object) : resource(q.object);
    lines.push(`  ${s} -> ${o} [label="${esc(short(p, opts.full))}"];`);
    triples++;
  }
  const dot = `digraph G {
  rankdir=${opts.dir}; bgcolor="transparent"; pad=0.3; nodesep=0.35; ranksep=0.9;
  node [shape=box, style=rounded, fontname="Times-Roman", fontsize=12, margin="0.12,0.06"];
  edge [fontname="Times-Roman", fontsize=11, color="${c.line}", fontcolor="${c.fg}", arrowsize=0.8];
${lines.join("\n")}
}`;
  return { dot, triples };
}

function options() {
  return { dir: $("o-dir").value, hideTypes: $("o-types").checked, hideAnnotations: $("o-annot").checked,
           example: $("o-example").checked, full: $("o-full").checked };
}

async function draw() {
  const my = ++seq;
  const { dot, triples } = buildDot(options());
  $("count").textContent = triples + " triples";
  const stage = $("stage");
  let svg;
  try { svg = await viz.renderSVGElement(dot); }
  catch (e) { if (my === seq) { stage.textContent = ""; stage.append(Object.assign(document.createElement("div"), { id: "msg", className: "err", textContent: "Graphviz error: " + e.message })); } return; }
  if (my !== seq) return;            // a newer draw superseded this one
  if (pz) { pz.destroy(); pz = null; }
  stage.textContent = "";
  svg.removeAttribute("width"); svg.removeAttribute("height");
  stage.append(svg);
  pz = svgPanZoom(svg, { zoomScaleSensitivity: 0.3, minZoom: 0.05, maxZoom: 40, controlIconsEnabled: true, fit: true, center: true });
}

async function main() {
  try {
    const res = await fetch(TTL_URL);
    if (!res.ok) throw new Error("HTTP " + res.status + " loading " + TTL_URL);
    const { quads, prefixes } = await parse(await res.text());
    const ont = quads.find(q => q.predicate.value === RDF + "type" && q.object.value === OWL + "Ontology");
    const title = ont && quads.find(q => q.subject.value === ont.subject.value && q.predicate.value === DCT + "title");
    model = { quads, prefixes, ns: prefixes[""] || "" };
    if (title) { $("title").textContent = title.object.value; document.title = title.object.value + " – Graph"; }
    viz = await Viz.instance();
  } catch (e) {
    $("msg").className = "err";
    $("msg").textContent = "Could not load the ontology: " + e.message + " (serve the site over http, not file://)";
    return;
  }
  ["o-dir", "o-types", "o-annot", "o-example", "o-full"].forEach(id => $(id).addEventListener("change", draw));
  window.addEventListener("resize", () => { if (pz) { pz.resize(); pz.fit(); pz.center(); } });
  window.__ontology = { buildDot, model };   // handy for debugging in the console
  draw();
}
main();
}
</script>

</html>
