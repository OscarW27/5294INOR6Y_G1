<main class="content-page">

  <a class="back-link" href="technical.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>Back to Technical</a>
  <h1>Sources</h1>
  <p>The scientific and data sources behind every dashboard measure, in BibTeX. Each card's "Why this?" popup links to its entries here.</p>

  <div class="bib-actions">
    <button type="button" id="copy-all" class="btn btn--primary">Copy all BibTeX</button>
    <a class="btn" href="sources.bib" download>Download sources.bib</a>
    <a href="sources.bib">Plain text file</a>
    <span id="copy-status" class="meta-label" aria-live="polite"></span>
  </div>

  <div id="bib-list"><p>Loading sources…</p></div>

</main>


<script>
var bibText = "";

// Split the .bib text into headings (% --- X --- lines) and entries (@type{key, ... balanced braces}).
function parseBib(text) {
  var lines = text.split(/\r?\n/), out = [], cur = null, depth = 0;
  lines.forEach(function (line) {
    if (!cur) {
      var h = line.match(/^%\s*-+\s*(.+?)\s*-+\s*$/);
      if (h) { out.push({ heading: h[1] }); return; }
      var m = line.match(/^@\w+\s*\{\s*([^,\s]+)\s*,/);
      if (!m) return;
      cur = { key: m[1], lines: [] };
      depth = 0;
    }
    cur.lines.push(line);
    for (var i = 0; i < line.length; i++) {
      if (line[i] === "{") depth++;
      else if (line[i] === "}") depth--;
    }
    if (depth <= 0) { out.push({ key: cur.key, text: cur.lines.join("\n") }); cur = null; }
  });
  if (cur) out.push({ key: cur.key, text: cur.lines.join("\n") });
  return out;
}

function copyText(text, label) {
  var status = document.getElementById("copy-status");
  function done(ok) { status.textContent = ok ? "Copied " + label + "." : "Copy failed: select the text and copy it manually."; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
  } else done(false);
}

function render(items) {
  var box = document.getElementById("bib-list");
  box.textContent = "";
  items.forEach(function (it) {
    if (it.heading) {
      var h = document.createElement("h2");
      h.textContent = (it.heading.charAt(0) + it.heading.slice(1).toLowerCase()).replace(/\bhci\b/i, "HCI");
      box.appendChild(h);
      return;
    }
    var wrap = document.createElement("div");
    wrap.className = "bib-entry";
    wrap.id = it.key;
    var pre = document.createElement("pre");
    pre.textContent = it.text;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn";
    btn.textContent = "Copy";
    btn.setAttribute("aria-label", "Copy BibTeX for " + it.key);
    btn.addEventListener("click", function () { copyText(it.text, it.key); });
    wrap.appendChild(pre);
    wrap.appendChild(btn);
    box.appendChild(wrap);
  });
  // Jump to the entry named in the URL (#key) once it exists.
  if (location.hash) {
    var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) target.scrollIntoView();
  }
}

document.getElementById("copy-all").addEventListener("click", function () {
  if (bibText) copyText(bibText, "all entries");
});

fetch("sources.bib")
  .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(function (text) { bibText = text; render(parseBib(text)); })
  .catch(function (err) {
    var box = document.getElementById("bib-list");
    box.textContent = "";
    var p = document.createElement("p");
    p.textContent = "Could not load sources.bib (" + err.message + "). Open the plain text file with the link above, or serve the site folder with a static web server.";
    box.appendChild(p);
  });
</script>

</div>
</div>
</body>
