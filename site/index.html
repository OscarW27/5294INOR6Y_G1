<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RunTracker (Prototype)</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<script src="sidebar.js"></script>
</head>
<body>

<div class="shell">
<aside class="sidebar">
  <div class="sidebar-head">
    <span class="brand">RunTracker</span>
    <button type="button" class="sidebar-toggle" aria-label="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M6 2.5v11"/><path d="M10.5 6.5 9 8l1.5 1.5"/></svg></button>
  </div>
  <nav class="side-nav" id="main-nav" aria-label="Site">
    <a href="#" data-section="dashboard" aria-current="page" class="active"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span class="nav-label">Dashboard</span></a>
    <a href="settings.html"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4"/></svg><span class="nav-label">Settings</span></a>
    <a href="privacy.html"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5.5a2.5 2.5 0 0 1 5 0V7"/></svg><span class="nav-label">Privacy</span></a>
    <a href="#" id="logout-link" style="margin-top:var(--space-4)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 2.5h-3v11h3"/><path d="M10 5l3 3-3 3"/><path d="M13 8H6.5"/></svg><span class="nav-label">Log out</span></a>
  </nav>
  <nav class="side-nav side-nav--bottom" aria-label="Technical">
    <a href="technical.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4 2 8l4 4M10 4l4 4-4 4"/></svg><span class="nav-label">Technical</span></a>
  </nav>
</aside>

<div class="shell-main">

<div id="login-screen" class="page auth-screen">
  <h1>Log in</h1>
  <div class="cards">
    <button type="button" class="role-card role-card--large" data-role="Beginner runner">Beginner runner</button>
    <button type="button" class="role-card role-card--large" data-role="Advanced runner">Advanced runner</button>
  </div>
  <div class="cards">
    <button type="button" class="role-card" data-role="Coach">Coach</button>
    <button type="button" class="role-card" data-role="Medical professional">Medical professional</button>
  </div>
</div>

<div id="app" class="page" hidden>
  <p id="whoami" class="meta-label" style="text-transform:none;letter-spacing:0"></p>

  <section id="random-run-summary" class="panel" hidden>
    <h3>Last run</h3>
    <p id="random-run-text" aria-live="polite">Loading your last run…</p>
  </section>

  <section id="run-history" class="panel" hidden>
    <div id="run-history-view">
      <div class="run-head">
        <h3>Run history</h3>
        <button type="button" id="run-search-open" class="btn btn--primary" style="margin-top:0">Search runs</button>
      </div>
      <ul id="run-history-list" class="run-list" aria-live="polite"><li>Loading runs…</li></ul>
    </div>
    <div id="run-search" hidden>
      <div class="run-head">
        <h3>Search runs</h3>
        <button type="button" id="run-search-close" class="btn btn--primary" style="margin-top:0">Close</button>
      </div>
      <input type="search" id="run-search-input" class="text-input" placeholder="Runner id, type (intense/steady/recovery) or value (e.g. 45 min, 8.2 km)" aria-label="Search runs">
      <div id="run-search-count"></div>
      <ul id="run-search-list" class="run-list"></ul>
    </div>
  </section>

  <section id="kpi-panel" class="panel" hidden>
    <div class="run-head">
      <h3>My training KPIs</h3>
      <div id="runner-mode-toggle" class="persona-tabs" role="group" aria-label="Runner mode" hidden>
        <button type="button" data-mode="Beginner" aria-pressed="true">Beginner</button>
        <button type="button" data-mode="Expert" aria-pressed="false">Expert</button>
      </div>
      <span>
        <label class="field-label" for="kpi-runner-input">Runner ID</label>
        <input type="text" id="kpi-runner-input" class="text-input" style="width:8rem" inputmode="numeric" aria-label="Runner ID">
        <button type="button" id="kpi-runner-show" class="btn btn--primary" style="margin-top:0">Show</button>
      </span>
    </div>
    <p id="kpi-meta" aria-live="polite">Loading KPIs…</p>
    <div id="kpi-cards" class="kpi-cards"></div>
  </section>

  <dialog id="why-dialog" class="why-dialog" aria-labelledby="why-title">
    <div class="why-head">
      <h3 id="why-title">Why we show this</h3>
      <button type="button" id="why-close" class="btn" aria-label="Close">Close</button>
    </div>
    <div id="why-body"></div>
  </dialog>

  <div id="log" class="meta-label" style="text-transform:none;letter-spacing:0;border-top:var(--border-width) solid var(--border-subtle);margin-top:var(--space-6);padding-top:var(--space-3)" aria-live="polite"></div>
</div>


</div>
</div>

<script src="summary.js"></script>
<script>
// ---------- fake auth (no real backend) ----------
var SESSION_KEY = "runtracker_session";
var RUNNER_MODE_KEY = "runtracker_runner_mode";
var RUNNER_ROLES = ["Beginner runner", "Advanced runner"];
var ROLE_TO_MODE = { "Beginner runner": "Beginner", "Advanced runner": "Expert" };

function getSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
}

function isRunner(session) {
  return !!session && RUNNER_ROLES.indexOf(session.role) !== -1;
}

// Last toggled value first, then the login-page role, then "Beginner".
function getRunnerMode(session) {
  var stored = localStorage.getItem(RUNNER_MODE_KEY);
  if (stored === "Beginner" || stored === "Expert") return stored;
  return ROLE_TO_MODE[session.role] || "Beginner";
}

function setRunnerModeButtons(mode) {
  document.querySelectorAll("#runner-mode-toggle button").forEach(function (btn) {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });
}

function showLogin() {
  document.getElementById("app").hidden = true;
  document.getElementById("login-screen").hidden = false;
  // Forget any remembered UI state from the previous user.
  document.querySelectorAll("#runner-mode-toggle button").forEach(function (btn) {
    btn.classList.remove("active");
  });
}

function showDashboard() {
  document.querySelectorAll("#main-nav a").forEach(function (a) {
    a.classList.toggle("active", a.dataset.section === "dashboard");
  });
}

function showApp(session) {
  document.getElementById("login-screen").hidden = true;
  var app = document.getElementById("app");
  app.hidden = false;
  app.dataset.theme = session.role; // persona accent colors
  document.getElementById("whoami").textContent = "Logged in as: " + (isRunner(session) ? "Runner" : session.role);
  document.getElementById("runner-mode-toggle").hidden = !isRunner(session);
  if (isRunner(session)) setRunnerModeButtons(getRunnerMode(session));
  document.getElementById("random-run-summary").hidden = !isRunner(session);
  document.getElementById("run-history").hidden = !isRunner(session);
  document.getElementById("kpi-panel").hidden = !isRunner(session);
  kpiRunner = null;
  document.getElementById("kpi-runner-input").value = "";
  closeSearch();
  showDashboard();
  logClick("Dashboard loaded for " + session.role);
  if (isRunner(session)) {
    showLastRun(session); // also builds/shows the run history (once per page load)
    renderKpis(session);
  }
}

document.querySelectorAll(".role-card").forEach(function (card) {
  card.addEventListener("click", function () {
    var session = { role: card.dataset.role, loggedInAt: new Date().toISOString() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    showApp(session);
  });
});

document.getElementById("logout-link").addEventListener("click", function (e) {
  e.preventDefault();
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(RUNNER_MODE_KEY); // forget the logged-out user's settings
  showLogin();
  closeSearch();
  document.getElementById("run-history").hidden = true;
  document.getElementById("kpi-panel").hidden = true;
  logClick("Logged out — remembered user and settings cleared");
});

// ---------- runner mode toggle (Beginner / Expert) ----------
document.getElementById("runner-mode-toggle").addEventListener("click", function (e) {
  var btn = e.target.closest("button[data-mode]");
  if (!btn || btn.classList.contains("active")) return;
  var mode = btn.dataset.mode;
  localStorage.setItem(RUNNER_MODE_KEY, mode);
  setRunnerModeButtons(mode);
  // Re-write the shown run summary in the newly chosen mode.
  if (currentTriples) {
    document.getElementById("random-run-text").textContent = RunSummary.buildSummary(currentTriples, mode);
  }
  logClick("Runner mode set to " + mode);
  var session = getSession();
  if (isRunner(session)) renderKpis(session); // Beginner and Expert show different KPI cards
});

// ---------- last run (runners only; logic in summary.js) (runners only; logic in summary.js) ----------
var workoutRows = null;
var currentTriples = null; // triples of the run currently shown

function loadWorkouts() {
  if (workoutRows) return Promise.resolve(workoutRows);
  return fetch("data/workouts.csv")
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (text) {
      workoutRows = RunSummary.parseCsv(text);
      if (!workoutRows.length) throw new Error("no rows in file");
      // Per-run k-means labels (analysis/run_types) for the focus sentence.
      // Optional: the dashboard still works without them (no focus shown).
      var labels = fetch("data/run_types.csv")
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function (t) { RunSummary.setRunTypes(RunSummary.parseCsv(t)); });
      return labels.catch(function () {}).then(function () { return workoutRows; });
    });
}

// Shows the newest run of the history (same single runner); called when the dashboard is shown.
function showLastRun(session) {
  var out = document.getElementById("random-run-text");
  currentTriples = null;
  out.textContent = "Loading your last run…";
  ensureRunHistory().then(function (runs) {
    document.getElementById("whoami").textContent = "Logged in as: Runner (ID " + runs[0].athlete + ")";
    var triples = runs[0].triples; // history is sorted newest first
    currentTriples = triples;
    var mode = getRunnerMode(session);
    out.textContent = RunSummary.buildSummary(triples, mode);
    logClick("Last run shown for " + mode + " (runner " + runs[0].athlete + ", workout " + runs[0].id + ")");
  }).catch(function (err) {
    out.textContent = "Could not load run data (data/workouts.csv): " + err.message +
      ". If you opened this page as a local file, serve the folder with a static web server instead.";
    logClick("Last run failed: " + err.message);
  });
}

// ---------- KPI cards (runners only; maths in summary.js, real workouts.csv data of ONE runner) ----------
var tsMap = null, tsPromise = null;   // timeseries.csv, loaded lazily (Expert mode only)
var kpiRunner = null;                 // runner typed in the box; null = the run-history runner
var kpiToken = 0;                     // ignore results of superseded renders

function loadTimeseries() {
  if (tsMap) return Promise.resolve(tsMap);
  if (!tsPromise) {
    tsPromise = fetch("data/timeseries.csv")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (text) { tsMap = RunSummary.parseTimeseries(text); return tsMap; })
      .catch(function (err) { tsPromise = null; throw err; });
  }
  return tsPromise;
}

var lastCards = null; // re-drawn on resize so the SVG charts match the card width

function drawKpiCards(cards) {
  var box = document.getElementById("kpi-cards");
  box.textContent = "";
  lastCards = cards;
  cards.forEach(function (c) {
    var div = document.createElement("div");
    div.className = "kpi-card" + (c.placeholder ? " kpi-card--placeholder" : "") + (c.wide ? " kpi-card--wide" : "");
    div.dataset.kpi = c.id;
    var head = el("div", "kpi-card__head");
    head.appendChild(el("h4", "", c.title));
    if (c.reason) {
      var why = el("button", "btn-why", "Why this?");
      why.type = "button";
      why.setAttribute("aria-haspopup", "dialog");
      why.addEventListener("click", function () { openReason(c); });
      head.appendChild(why);
    }
    div.appendChild(head);
    if (c.stats) div.appendChild(statsEl(c.stats));
    if (c.zones) div.appendChild(zonesEl(c.zones));
    if (c.weekZones) div.appendChild(weekZonesChart(c.weekZones));
    if (c.scatter) div.appendChild(strainScatterChart(c.scatter));
    if (c.bars) div.appendChild(barsEl(c.bars));
    // Lines after the first `collapse` ones go under a "Details" toggle.
    var cut = c.collapse || c.lines.length;
    div.appendChild(linesEl(c.lines.slice(0, cut)));
    if (c.lines.length > cut) {
      var det = document.createElement("details");
      var sum = document.createElement("summary");
      sum.textContent = "Details";
      det.appendChild(sum);
      det.appendChild(linesEl(c.lines.slice(cut)));
      div.appendChild(det);
    }
    box.appendChild(div);
  });
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function statsEl(stats) {
  var wrap = el("div", "kpi-stats");
  stats.forEach(function (s) {
    var d = el("div", "kpi-stat");
    d.appendChild(el("b", "", s.value));
    d.appendChild(el("span", "", s.label));
    wrap.appendChild(d);
  });
  return wrap;
}

// Stacked low/moderate/high bar per row (percent text inside the segment when wide enough).
function zonesEl(zones) {
  var wrap = el("div", "kpi-zones");
  wrap.appendChild(el("div", "kpi-sub", "Time in heart rate zones"));
  zones.forEach(function (z) {
    var row = el("div", "zone-row");
    row.appendChild(el("span", "", z.label));
    var bar = el("div", "zonebar");
    [["low", "z-low"], ["mod", "z-mod"], ["high", "z-high"]].forEach(function (k) {
      var seg = el("i", k[1], z[k[0]] >= 0.1 ? Math.round(z[k[0]] * 100) + "%" : "");
      seg.style.width = (z[k[0]] * 100) + "%";
      seg.title = k[0] + " " + Math.round(z[k[0]] * 100) + " %";
      bar.appendChild(seg);
    });
    row.appendChild(bar);
    wrap.appendChild(row);
  });
  var legend = el("div", "zone-legend");
  legend.appendChild(document.createTextNode("Zones: "));
  [["Recovery", "badge-intensity--recovery"], ["Steady", "badge-intensity--steady"], ["Intensive", "badge-intensity--intensive"]].forEach(function (b) {
    legend.appendChild(document.createTextNode(" "));
    legend.appendChild(el("em", "badge-intensity " + b[1], b[0]));
  });
  wrap.appendChild(legend);
  return wrap;
}

function barsEl(bars) {
  var wrap = el("div", "kpi-bars"), max = 0;
  bars.items.forEach(function (it) { if (it.value > max) max = it.value; });
  wrap.appendChild(el("div", "kpi-sub", bars.title));
  bars.items.forEach(function (it) {
    var row = el("div", "bar-row");
    row.appendChild(el("span", "", it.label));
    var track = el("div", "bar-track"), fill = el("div", "bar-fill " + (it.cls || ""));
    fill.style.width = (max > 0 ? Math.max(it.value / max * 100, it.value > 0 ? 2 : 0) : 0) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("span", "", it.text));
    wrap.appendChild(row);
  });
  return wrap;
}

// ---------- SVG charts (Expert cards) ----------
var SVG_NS = "http://www.w3.org/2000/svg";
var chartSeq = 0;

function svgEl(tag, attrs, cls) {
  var e = document.createElementNS(SVG_NS, tag);
  Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
  if (cls) e.setAttribute("class", cls);
  return e;
}
function svgText(x, y, str, anchor, cls) {
  var t = svgEl("text", { x: x, y: y, "text-anchor": anchor || "start" }, cls);
  t.textContent = str;
  return t;
}
function fmt1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
function signedStr(v) { return (v >= 0 ? "+" : "") + fmt1(v); }
// Wide cards span the KPI grid; subtract the card padding + border.
function chartWidth() {
  var w = document.getElementById("kpi-cards").clientWidth || 640;
  return Math.max(280, Math.min(w - 34, 960));
}
function niceTicks(lo, hi, count) {
  var raw = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), n = raw / mag;
  var step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag, out = [];
  var dLo = Math.floor(lo / step) * step, dHi = Math.ceil(hi / step) * step;
  for (var v = dLo; v <= dHi + step / 2; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return { ticks: out, lo: dLo, hi: dHi };
}
// Rect with 4px rounded top corners, square at the baseline.
function topRounded(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return "M" + x + "," + (y + h) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
    "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + h) + "Z";
}
function legendEl(items) {
  var lg = el("div", "chart-legend");
  items.forEach(function (it) {
    var s = el("span");
    s.appendChild(el("i", it.cls));
    s.appendChild(document.createTextNode(it.label));
    lg.appendChild(s);
  });
  return lg;
}
// Hover + keyboard focus tooltip on a hit target; the first line is the value (bold).
function attachTip(wrap, tip, hit, marks, lines, x, y, width) {
  function show() {
    tip.textContent = "";
    tip.appendChild(el("b", "", lines[0]));
    lines.slice(1).forEach(function (l) { tip.appendChild(el("div", "", l)); });
    tip.style.left = (x > width / 2 ? x - 12 : x + 12) + "px";
    tip.style.top = Math.max(y - 12, 0) + "px";
    tip.style.transform = x > width / 2 ? "translateX(-100%)" : "none";
    tip.hidden = false;
    marks.forEach(function (m) { m.classList.add("is-hover"); });
  }
  function hide() {
    tip.hidden = true;
    marks.forEach(function (m) { m.classList.remove("is-hover"); });
  }
  hit.addEventListener("pointerenter", show);
  hit.addEventListener("focus", show);
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("blur", hide);
}
function tableView(head, rows) {
  var det = el("details", "chart-table");
  det.appendChild(el("summary", "", "Table view"));
  var table = el("table", "data-table"), thead = el("thead"), tr = el("tr");
  head.forEach(function (h, i) { tr.appendChild(el("th", i > 0 ? "num" : "", h)); });
  thead.appendChild(tr);
  table.appendChild(thead);
  var tbody = el("tbody");
  rows.forEach(function (r) {
    var row = el("tr", "data-row");
    r.forEach(function (v, i) { row.appendChild(el("td", i > 0 ? "num" : "", v)); });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  det.appendChild(table);
  return det;
}
function chartShell(title) {
  var wrap = el("div", "chart");
  wrap.appendChild(el("div", "kpi-sub", title));
  return wrap;
}

var SOURCE_SHORT = { "estimate": "est.", "time-series": "series", "mixed": "mixed", "rest": "" };

// Chart 4: per-week 100 % stacked columns (low bottom, moderate, high) with the ~80 % low reference line.
function weekZonesChart(wz) {
  var wrap = chartShell("Time in heart rate zones per week, last " + wz.weeks.length + " weeks");
  wrap.appendChild(legendEl([
    { cls: "key-low", label: "Low (< 80 % HRmax)" },
    { cls: "key-mod", label: "Moderate (80–90 %)" },
    { cls: "key-high", label: "High (≥ 90 %)" },
    { cls: "line key-ref", label: Math.round(wz.target * 100) + " % low-intensity reference" }
  ]));
  var W = chartWidth(), H = 210, m = { l: 40, r: 56, t: 14, b: 38 }, ph = H - m.t - m.b, pw = W - m.l - m.r;
  var base = m.t + ph;
  function y(p) { return m.t + ph * (1 - p); }
  var svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img",
    "aria-label": "Weekly share of time in low, moderate and high heart rate zones; low share over the period " +
      (wz.lowShare === null ? "n/a" : Math.round(wz.lowShare * 100) + " %") + " against an " + Math.round(wz.target * 100) + " % reference." });
  [0, 0.25, 0.5, 0.75, 1].forEach(function (p) {
    svg.appendChild(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(p), y2: y(p) }, p === 0 ? "axis" : "grid"));
    svg.appendChild(svgText(m.l - 6, y(p) + 4, Math.round(p * 100) + " %", "end"));
  });
  var tip = el("div", "chart-tip");
  tip.hidden = true;
  var slot = pw / wz.weeks.length, bw = Math.min(24, slot * 0.6), GAP = 2;
  wz.weeks.forEach(function (w, i) {
    var cx = m.l + slot * (i + 0.5), x0 = cx - bw / 2;
    svg.appendChild(svgText(cx, base + 15, w.label.slice(5), "middle"));
    svg.appendChild(svgText(cx, base + 29, SOURCE_SHORT[w.source], "middle"));
    if (!w.runs) { svg.appendChild(svgText(cx, base - 6, "rest", "middle")); return; }
    var parts = [["low", "seg-low"], ["mod", "seg-mod"], ["high", "seg-high"]].filter(function (p) { return w[p[0]] * ph >= 0.5; });
    var y0 = base, marks = [];
    parts.forEach(function (p, j) {
      var h = w[p[0]] * ph, top = y0 - h, bottom = j === 0 ? y0 : y0 - GAP;
      var seg = j === parts.length - 1
        ? svgEl("path", { d: topRounded(x0, top, bw, Math.max(bottom - top, 0), 4) }, "mark " + p[1])
        : svgEl("rect", { x: x0, y: top, width: bw, height: Math.max(bottom - top, 0) }, "mark " + p[1]);
      svg.appendChild(seg);
      marks.push(seg);
      y0 = top;
    });
    var hit = svgEl("rect", { x: cx - slot / 2, y: m.t, width: slot, height: ph, tabindex: 0,
      "aria-label": w.label + ": low " + Math.round(w.low * 100) + " %, moderate " + Math.round(w.mod * 100) + " %, high " + Math.round(w.high * 100) + " %" }, "hit");
    attachTip(wrap, tip, hit, marks, [
      "Low " + Math.round(w.low * 100) + " % · mod " + Math.round(w.mod * 100) + " % · high " + Math.round(w.high * 100) + " %",
      w.label + ": " + w.runs + (w.runs === 1 ? " run, " : " runs, ") + Math.round(w.minutes) + " min",
      "Zones from: " + (w.source === "estimate" ? "summary estimate" : w.source)
    ], cx, y0, W);
    svg.appendChild(hit);
  });
  svg.appendChild(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(wz.target), y2: y(wz.target) }, "ref"));
  svg.appendChild(svgText(W - m.r + 6, y(wz.target) + 4, Math.round(wz.target * 100) + " % low", "start", "strong"));
  wrap.appendChild(svg);
  wrap.appendChild(tip);
  wrap.appendChild(el("p", "chart-note",
    "Each column is one week (minute-weighted). The green part reaching the line means about 80 % easy running. " +
    "Under the week: est. = zones estimated from the run summary, series = measured from the heart-rate time series."));
  wrap.appendChild(tableView(["Week", "Runs", "Minutes", "Low %", "Moderate %", "High %", "Zones from"], wz.weeks.map(function (w) {
    return w.runs
      ? [w.label, String(w.runs), String(Math.round(w.minutes)), String(Math.round(w.low * 100)), String(Math.round(w.mod * 100)),
        String(Math.round(w.high * 100)), w.source === "estimate" ? "summary estimate" : w.source]
      : [w.label, "0", "0", "–", "–", "–", "rest"];
  })));
  return wrap;
}

// Chart 6: every run as heart rate vs speed, with the expected-HR line and the flag zone (>= +5 bpm above it).
function strainScatterChart(sc) {
  var pts = sc.points, wrap = chartShell("Heart rate vs speed, all " + pts.length + " runs");
  var nLatest = pts.filter(function (p) { return p.group === "latest"; }).length;
  wrap.appendChild(legendEl([
    { cls: "dot key-earlier", label: "Earlier runs (baseline)" },
    { cls: "dot key-latest", label: "Latest " + nLatest + " runs" },
    { cls: "dot key-flag", label: "Flagged run" },
    { cls: "line key-trend", label: sc.model === "line" ? "Expected HR for that speed" : "Expected HR (mean of earlier runs)" },
    { cls: "zone key-flag-zone", label: "Flag zone (≥ +" + sc.flagBpm + " bpm above expected)" }
  ]));
  function expectedAt(s) { return sc.fit ? sc.fit.a + sc.fit.b * s : sc.baseHr; }
  var sx = pts.map(function (p) { return p.speed; }), sMin = Math.min.apply(null, sx), sMax = Math.max.apply(null, sx);
  var xpad = Math.max((sMax - sMin) * 0.08, 0.3), xt = niceTicks(sMin - xpad, sMax + xpad, 5);
  var hy = [];
  pts.forEach(function (p) { hy.push(p.hr, p.expected + sc.flagBpm); });
  var yt = niceTicks(Math.min.apply(null, pts.map(function (p) { return Math.min(p.hr, p.expected); })) - 3, Math.max.apply(null, hy) + 3, 5);
  var W = chartWidth(), H = 270, m = { l: 48, r: 16, t: 12, b: 42 }, ph = H - m.t - m.b, pw = W - m.l - m.r;
  function X(v) { return m.l + (v - xt.lo) / (xt.hi - xt.lo) * pw; }
  function Y(v) { return m.t + ph * (1 - (v - yt.lo) / (yt.hi - yt.lo)); }
  var flagged = pts.filter(function (p) { return p.flag; }).length;
  var svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img",
    "aria-label": "Scatter of average heart rate against average speed for " + pts.length + " runs; " + flagged + " of the latest " + nLatest + " runs are in the flag zone." });
  var clipId = "clip-strain-" + (++chartSeq), defs = svgEl("defs"), clip = svgEl("clipPath", { id: clipId });
  clip.appendChild(svgEl("rect", { x: m.l, y: m.t, width: pw, height: ph }));
  defs.appendChild(clip);
  svg.appendChild(defs);
  yt.ticks.forEach(function (v) {
    svg.appendChild(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v) }, "grid"));
    svg.appendChild(svgText(m.l - 6, Y(v) + 4, String(v), "end"));
  });
  svg.appendChild(svgEl("line", { x1: m.l, x2: W - m.r, y1: m.t + ph, y2: m.t + ph }, "axis"));
  xt.ticks.forEach(function (v) { svg.appendChild(svgText(X(v), m.t + ph + 15, String(v), "middle")); });
  svg.appendChild(svgText(m.l + pw / 2, H - 4, "Average speed (km/h)", "middle"));
  var yl = svgText(0, 0, "Average heart rate (bpm)", "middle");
  yl.setAttribute("transform", "translate(12," + (m.t + ph / 2) + ") rotate(-90)");
  svg.appendChild(yl);
  var plot = svgEl("g", { "clip-path": "url(#" + clipId + ")" });
  var e0 = expectedAt(xt.lo), e1 = expectedAt(xt.hi);
  plot.appendChild(svgEl("path", { d: "M" + X(xt.lo) + "," + Y(e0 + sc.flagBpm) + "L" + X(xt.hi) + "," + Y(e1 + sc.flagBpm) +
    "L" + X(xt.hi) + "," + m.t + "L" + X(xt.lo) + "," + m.t + "Z" }, "flag-zone"));
  plot.appendChild(svgEl("line", { x1: X(xt.lo), y1: Y(e0), x2: X(xt.hi), y2: Y(e1) }, "trend"));
  svg.appendChild(plot);
  svg.appendChild(svgText(m.l + 6, m.t + 14, "flag zone", "start"));
  var tip = el("div", "chart-tip");
  tip.hidden = true;
  var order = { earlier: 0, latest: 1 }, newest = pts[pts.length - 1];
  pts.slice().sort(function (a, b) { return (order[a.group] + (a.flag ? 1 : 0)) - (order[b.group] + (b.flag ? 1 : 0)); }).forEach(function (p) {
    var cx = X(p.speed), cy = Y(p.hr);
    // Flagged dots are larger and labelled: red vs the focus green is close for protan readers.
    var dot = svgEl("circle", { cx: cx, cy: cy, r: p.flag ? 6.5 : 4.5 }, "mark dot " + (p.flag ? "dot--flag" : "dot--" + p.group));
    svg.appendChild(dot);
    var label = p.flag ? "flag " + signedStr(p.resid) : p === newest ? "latest run" : "";
    if (label) svg.appendChild(svgText(cx + 8, cy - 7, label, "start", "strong"));
    var hit = svgEl("circle", { cx: cx, cy: cy, r: 12, tabindex: 0,
      "aria-label": p.date + ": HR " + Math.round(p.hr) + " bpm at " + fmt1(p.speed) + " km/h, " + signedStr(p.resid) + " bpm vs expected" }, "hit");
    attachTip(wrap, tip, hit, [dot], [
      "HR " + Math.round(p.hr) + " bpm at " + fmt1(p.speed) + " km/h",
      p.date + " · pace " + RunSummary.fmtPace(p.pace) + " /km",
      "Expected " + Math.round(p.expected) + " bpm (" + signedStr(p.resid) + " bpm)" + (p.flag ? " · FLAG" : ""),
      p.group === "latest" ? "One of the latest " + nLatest + " runs" : "Earlier run (baseline)"
    ], cx, cy, W);
    svg.appendChild(hit);
  });
  wrap.appendChild(svg);
  wrap.appendChild(tip);
  wrap.appendChild(el("p", "chart-note", sc.model === "line"
    ? "The line is the heart rate you usually have at each speed (fitted on the earlier runs). A latest run far above it cost more heart beats than usual for that speed."
    : "Speeds hardly vary between the earlier runs, so the expected heart rate is their mean."));
  wrap.appendChild(tableView(["Date", "Speed km/h", "Pace /km", "HR bpm", "Expected bpm", "Difference", "Group"], pts.slice().reverse().map(function (p) {
    return [p.date, fmt1(p.speed), RunSummary.fmtPace(p.pace), String(Math.round(p.hr)), String(Math.round(p.expected)),
      signedStr(p.resid) + (p.flag ? " FLAG" : ""), p.group === "latest" ? "latest" : "earlier"];
  })));
  return wrap;
}

// ---------- "Why this?" reasoning popup ----------
function openReason(card) {
  var dlg = document.getElementById("why-dialog"), body = document.getElementById("why-body");
  document.getElementById("why-title").textContent = "Why we show: " + card.title;
  body.textContent = "";
  card.reason.why.forEach(function (p) { body.appendChild(el("p", "", p)); });
  if (card.reason.caveat) body.appendChild(el("p", "why-caveat", card.reason.caveat));
  body.appendChild(el("h4", "", "Sources"));
  var ul = el("ul", "why-sources");
  card.reason.sources.forEach(function (key) {
    var s = RunSummary.SOURCES[key];
    if (!s) return;
    var li = el("li");
    li.appendChild(el("b", "", s.cite + ". "));
    li.appendChild(document.createTextNode(s.title + (/[.?!]$/.test(s.title) ? " " : ". ")));
    if (s.link) {
      var a = el("a", "", s.link.indexOf("doi.org") >= 0 ? "DOI" : "Link");
      a.href = s.link; a.target = "_blank"; a.rel = "noopener";
      li.appendChild(a);
      li.appendChild(document.createTextNode(" · "));
    }
    var bib = el("a", "", "BibTeX");
    bib.href = "sources.html#" + key;
    li.appendChild(bib);
    ul.appendChild(li);
  });
  body.appendChild(ul);
  if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  logClick("Reasoning opened for " + card.title);
}

document.getElementById("why-close").addEventListener("click", function () {
  var dlg = document.getElementById("why-dialog");
  if (typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open");
});

if (typeof window !== "undefined" && window.addEventListener) {
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (lastCards && !document.getElementById("kpi-panel").hidden) drawKpiCards(lastCards);
    }, 150);
  });
}

// A trailing " FLAG" in a line becomes a red badge.
function linesEl(lines) {
  var ul = document.createElement("ul");
  lines.forEach(function (line) {
    var li = document.createElement("li"), i = line.indexOf(" FLAG");
    if (i < 0) li.textContent = line;
    else {
      li.appendChild(document.createTextNode(line.slice(0, i) + " "));
      li.appendChild(el("em", "badge", "FLAG"));
      li.appendChild(document.createTextNode(line.slice(i + 5)));
    }
    ul.appendChild(li);
  });
  return ul;
}

function renderKpis(session) {
  var mode = getRunnerMode(session), token = ++kpiToken;
  var meta = document.getElementById("kpi-meta");
  meta.textContent = "Loading KPIs…";
  document.getElementById("kpi-cards").textContent = "";
  var tsNote = "";
  ensureRunHistory().then(function (runs) {
    var uid = kpiRunner || runs[0].athlete;
    return Promise.all([
      loadWorkouts(),
      mode === "Expert"
        ? loadTimeseries().catch(function (err) { tsNote = " Time-series file not loaded (" + err.message + "): all zones are estimated."; return null; })
        : Promise.resolve(null)
    ]).then(function (res) { return { uid: uid, rows: res[0], ts: res[1] }; });
  }).then(function (d) {
    if (token !== kpiToken) return;
    var ctx = RunSummary.buildKpiContext(d.rows, d.uid, d.ts);
    if (!ctx) {
      meta.textContent = "No usable runs found for runner " + d.uid + ".";
      logClick("KPIs: no runs for runner " + d.uid);
      return;
    }
    var first = ctx.runs[0].date, last = ctx.runs[ctx.runs.length - 1].date;
    meta.textContent = "Runner " + ctx.athlete + ": " + ctx.runs.length + " runs from " + first + " to " + last +
      " (real start dates from workouts.csv)." + tsNote;
    drawKpiCards(RunSummary.kpiCards(ctx, mode));
    logClick("KPIs shown for " + mode + " (runner " + ctx.athlete + ", " + ctx.runs.length + " runs)");
  }).catch(function (err) {
    if (token !== kpiToken) return;
    meta.textContent = "Could not load KPI data: " + err.message;
    logClick("KPIs failed: " + err.message);
  });
}

document.getElementById("kpi-runner-show").addEventListener("click", function () {
  var v = document.getElementById("kpi-runner-input").value.trim();
  var session = getSession();
  if (!v || !isRunner(session)) return;
  kpiRunner = v;
  renderKpis(session);
});

// ---------- run history + search (runners only; mapping in summary.js) ----------
var HISTORY_SIZE = 10;
var WEEK_MS = 7 * 24 * 3600 * 1000;
var historyRuns = null;   // generated once per page load, newest first
var runIndex = null;      // triples-mapped index of the full CSV, built lazily

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function fmtWhen(d) {
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " +
    pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

function renderRunItems(ul, runs, withTime) {
  ul.textContent = "";
  runs.forEach(function (r) {
    var li = document.createElement("li");
    if (withTime) {
      var w = document.createElement("span");
      w.className = "when";
      w.textContent = fmtWhen(r.when);
      li.appendChild(w);
    }
    li.appendChild(document.createTextNode(RunSummary.formatRun(r) + (withTime ? "" : " — runner " + r.athlete)));
    ul.appendChild(li);
  });
}

function setListMessage(ul, msg) {
  ul.textContent = "";
  var li = document.createElement("li");
  li.textContent = msg;
  ul.appendChild(li);
}

// Generated once per page load: ONE random runner's runs, timestamps within the last 7 days.
// Returns a promise of the runs (newest first); the first one is the "Last run".
var historyPromise = null;
function ensureRunHistory() {
  var ul = document.getElementById("run-history-list");
  if (historyRuns) { renderRunItems(ul, historyRuns, true); return Promise.resolve(historyRuns); }
  if (historyPromise) return historyPromise;
  setListMessage(ul, "Loading runs…");
  historyPromise = loadWorkouts().then(function (rows) {
    var uid = null, own = [];
    for (var tries = 0; tries < 50; tries++) {
      uid = rows[Math.floor(Math.random() * rows.length)].user_id;
      own = rows.filter(function (r) { return r.user_id === uid; });
      if (own.length >= HISTORY_SIZE) break;
    }
    var now = Date.now(), runs = [];
    for (var guard = 0; runs.length < HISTORY_SIZE && guard < 1000; guard++) {
      var t = RunSummary.rowToTriples(own[Math.floor(Math.random() * own.length)]);
      if (!t) continue;
      var info = RunSummary.runInfo(t);
      info.triples = t;
      info.when = new Date(now - Math.random() * WEEK_MS);
      runs.push(info);
    }
    if (!runs.length) throw new Error("no usable runs found");
    runs.sort(function (a, b) { return b.when - a.when; });
    historyRuns = runs;
    renderRunItems(ul, runs, true);
    logClick("Run history shown (runner " + runs[0].athlete + ", " + runs.length + " runs)");
    return runs;
  }).catch(function (err) {
    historyPromise = null;
    setListMessage(ul, "Could not load run data: " + err.message);
    throw err;
  });
  return historyPromise;
}

var searchTimer = null;
function runSearch() {
  var q = document.getElementById("run-search-input").value;
  var list = document.getElementById("run-search-list");
  var count = document.getElementById("run-search-count");
  if (!runIndex) return;
  if (!q.trim()) {
    list.textContent = "";
    count.textContent = "Type to search all " + runIndex.length + " runs.";
    return;
  }
  var res = RunSummary.searchIndex(runIndex, q, 50);
  renderRunItems(list, res.hits, false);
  count.textContent = res.total + " match" + (res.total === 1 ? "" : "es") +
    (res.total > res.hits.length ? " (showing first " + res.hits.length + ")" : "");
}

function openSearch() {
  document.getElementById("run-history-view").hidden = true;
  document.getElementById("run-search").hidden = false;
  document.getElementById("run-search-input").focus();
  if (runIndex) { runSearch(); return; }
  document.getElementById("run-search-count").textContent = "Loading runs…";
  loadWorkouts().then(function (rows) {
    if (!runIndex) runIndex = RunSummary.buildIndex(rows);
    runSearch();
  }).catch(function (err) {
    document.getElementById("run-search-count").textContent = "Could not load run data: " + err.message;
  });
}

function closeSearch() {
  clearTimeout(searchTimer);
  document.getElementById("run-search").hidden = true;
  document.getElementById("run-history-view").hidden = false;
  document.getElementById("run-search-input").value = "";
  document.getElementById("run-search-list").textContent = "";
  document.getElementById("run-search-count").textContent = "";
}

document.getElementById("run-search-open").addEventListener("click", function () {
  openSearch();
  logClick("Search runs opened");
});
document.getElementById("run-search-close").addEventListener("click", function () {
  closeSearch();
  logClick("Search runs closed");
});
document.getElementById("run-search-input").addEventListener("input", function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 120);
});

// ---------- navigation / visible feedback ----------
var logBox = document.getElementById("log");

function logClick(message) {
  var line = new Date().toLocaleTimeString() + " — " + message;
  var p = document.createElement("div");
  p.textContent = line;
  logBox.prepend(p);
}

function showSection(name) {
  if (name === "dashboard") showDashboard();
}

document.getElementById("main-nav").addEventListener("click", function (e) {
  var a = e.target.closest("a[data-section]");
  if (!a) return;
  e.preventDefault();
  showSection(a.dataset.section);
  logClick("Navigated to " + a.dataset.section);
});

// ---------- restore session on refresh ----------
(function init() {
  var session = getSession();
  if (session && session.role) showApp(session); else showLogin();
})();
</script>
